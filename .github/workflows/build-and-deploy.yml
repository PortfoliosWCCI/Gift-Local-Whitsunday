name: Build and deploy Gift Local

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"        # every hour: picks up new approvals in Airtable
  workflow_dispatch:            # "Run workflow" button in the Actions tab = rebuild now
  repository_dispatch:
    types: [rebuild]            # optional: Airtable automation can trigger this

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build site from Airtable
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: appPoEgYaSjA1tpJg
        run: node build.mjs
      - name: Add custom domain file
        if: vars.SITE_DOMAIN != ''
        run: echo "${{ vars.SITE_DOMAIN }}" > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
